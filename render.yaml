services:
  - type: web
    name: rubriq-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "gunicorn run:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
